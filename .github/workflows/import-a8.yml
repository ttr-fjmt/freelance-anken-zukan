name: Import A8 affiliate agents

on:
  workflow_dispatch:
    inputs:
      file:
        description: "取り込むExcelファイルのパス（リポジトリルートからの相対パス。例: data/a8-import/a8-freelance-20260906.xlsx）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # agents.json / categories.json をコミット・pushする。他の書き込み系ワークフロー
  # (discover-agents.yml 等)と衝突しないよう、共通のグループ名を踏襲する。
  group: repo-content-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci

      - name: Import A8 affiliate agents into agents.json via Claude
        working-directory: scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node import-a8.js "../${{ inputs.file }}"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agents.json categories.json "${{ inputs.file }}"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: import A8 affiliate agents from $(basename "${{ inputs.file }}")"

          max_retries=2
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt "$max_retries" ]; then
              echo "::error::push failed after $max_retries retries"
              exit 1
            fi
            echo "push failed (attempt $attempt/$max_retries) — pulling --rebase and retrying..."
            git pull --rebase origin main
          done
