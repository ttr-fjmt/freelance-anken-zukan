name: Import A8 affiliate agents

# 運用手順: data/a8-import/アフィリエイト案件_フリーランス案件図鑑.xlsx （固定ファイル名）を
# 都度上書き更新してコミット・pushした後、このワークフローを手動実行してください。
# 取り込んだ行はExcel側のA列（反映）が自動的にTRUEに更新され、agents.jsonと一緒に
# コミットされます。

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # agents.json / categories.json をコミット・pushする。他の書き込み系ワークフロー
  # (discover-agents.yml 等)と衝突しないよう、共通のグループ名を踏襲する。
  group: repo-content-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json

      - name: Cache Puppeteer's bundled Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-chromium-${{ runner.os }}-${{ hashFiles('scraper/package-lock.json') }}

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci

      - name: Import A8 affiliate agents into agents.json via Claude
        working-directory: scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node import-a8.js

      - name: Install Chrome runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates fonts-liberation libasound2t64 libatk-bridge2.0-0 libatk1.0-0 \
            libcups2 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 \
            libpango-1.0-0 libpangocairo-1.0-0 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 \
            libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2 xdg-utils

      - name: Prerender agent detail pages (static SSG via Puppeteer)
        working-directory: scraper
        run: node prerender.js

      - name: Regenerate sitemap.xml
        working-directory: scraper
        run: node generate-sitemap.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agents.json categories.json sitemap.xml
          # import-a8.jsが処理済み行のA列(反映)をTRUEに書き換えたExcelファイル自体も
          # 一緒にコミットする。
          git add data/a8-import/
          [ -f data/ssg-manifest.json ] && git add data/ssg-manifest.json
          [ -d agent ] && git add agent
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: import A8 affiliate agents ($(date -u +%Y-%m-%d))"

          max_retries=2
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt "$max_retries" ]; then
              echo "::error::push failed after $max_retries retries"
              exit 1
            fi
            echo "push failed (attempt $attempt/$max_retries) — pulling --rebase and retrying..."
            git pull --rebase origin main
          done
