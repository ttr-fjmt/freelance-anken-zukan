name: Discover new freelance agents (daily)

on:
  schedule:
    # 毎日 20:00 UTC(前日) = 日本時間(JST) 5:00 に実行
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      max_candidates:
        description: "1回の実行で新規発見を試みる候補数の上限（手動実行専用。空欄なら50件。日次自動実行は常に10件のまま）"
        required: false
        type: string
        default: "50"

permissions:
  contents: write

concurrency:
  # agents.json / categories.json / data/agent-discover-skip.json をコミット・pushする。
  # 他の書き込み系ワークフローと衝突しないよう、agent-zukan側の既存ワークフロー
  # (scrape-agents.yml 等)と同じグループ名を踏襲する。
  group: repo-content-write
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json

      - name: Cache Puppeteer's bundled Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-chromium-${{ runner.os }}-${{ hashFiles('scraper/package-lock.json') }}

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci

      - name: Discover, verify and list new freelance agents via Claude (web_search)
        working-directory: scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 手動実行(workflow_dispatch)時のみ入力値(未入力ならinput自体のdefault: 50)を使う。
          # 日次cron実行時はコスト・品質管理のため常に10件のまま。
          DISCOVER_MAX_PER_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_candidates || '10' }}
        run: node discover-agents.js

      - name: Install Chrome runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates fonts-liberation libasound2t64 libatk-bridge2.0-0 libatk1.0-0 \
            libcups2 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 \
            libpango-1.0-0 libpangocairo-1.0-0 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 \
            libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2 xdg-utils

      - name: Prerender agent detail pages (static SSG via Puppeteer)
        working-directory: scraper
        run: node prerender.js

      - name: Generate category landing pages
        working-directory: scraper
        run: node generate-category-pages.js

      - name: Regenerate sitemap.xml
        working-directory: scraper
        run: node generate-sitemap.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agents.json categories.json sitemap.xml
          [ -f data/agent-discover-skip.json ] && git add data/agent-discover-skip.json
          [ -f data/ssg-manifest.json ] && git add data/ssg-manifest.json
          [ -d agent ] && git add agent
          [ -d category ] && git add category
          # 収穫逓減の判定材料（次回どのカテゴリーを回すかはこの履歴だけを根拠にする）。
          [ -f data/discovery-runs.json ] && git add data/discovery-runs.json
          # API消費量の記録（scraper/lib/usage-log.js）。掲載データが変わらない日も費用は発生している。
          [ -d data/usage-log ] && git add data/usage-log
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: discover new freelance agents ($(date -u +%Y-%m-%d))"

          max_retries=2
          attempt=0
          until git push; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt "$max_retries" ]; then
              echo "::error::push failed after $max_retries retries"
              exit 1
            fi
            echo "push failed (attempt $attempt/$max_retries) — pulling --rebase and retrying..."
            git pull --rebase origin main
          done
